version: '3.8'

services:
  dummy-service:
    image: redis:7.4.3-alpine
    container_name: redis-test-server
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    restart: unless-stopped
